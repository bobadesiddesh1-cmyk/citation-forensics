<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AnswerShare</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><em>ANSWER</em>SHARE</div>
    <div class="tagline">AI share-of-voice — 100% local</div>
  </header>

  <section class="stats">
    <div class="stat"><b id="stat-records">0</b><span>captures</span></div>
    <div class="stat"><b id="stat-share">–</b><span>your share 30d</span></div>
    <div class="stat"><b id="stat-losses">0</b><span>losses 30d</span></div>
  </section>

  <div class="latest" id="latest"></div>

  <button id="open-dashboard" class="cta">OPEN DASHBOARD →</button>

  <footer>No network requests. No analytics. Everything stays in your browser.</footer>

  <script src="../shared/tokenizer.js"></script>
  <script src="../shared/stoplist.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
